<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turni Lavoro</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial,sans-serif;max-width:500px;margin:auto;padding:16px}
.btns button.active{font-weight:bold}
input,button{width:100%;padding:12px;margin:6px 0}
.row{display:flex;gap:10px}
.row button{flex:1}
</style>
</head>
<body>
<h2>Turni Lavoro</h2>
<div class="row btns">
<button id="pub">Pub</button>
<button id="rist">Ristorante</button>
</div>
<input type="date" id="date">
<input type="time" id="start">
<input type="time" id="end">
<button onclick="saveTurn()">Salva</button>
<button onclick="showArchive()">Archivio</button>
<pre id="out"></pre>
<script>
let category="Pub";
pub.onclick=()=>{category="Pub";pub.classList.add("active");rist.classList.remove("active")}
rist.onclick=()=>{category="Ristorante";rist.classList.add("active");pub.classList.remove("active")}
pub.click();

function getTurns(){return JSON.parse(localStorage.getItem("turns")||"[]")}
function setTurns(t){localStorage.setItem("turns",JSON.stringify(t))}

function saveTurn(){
 const turns=getTurns();
 turns.push({date:date.value,start:start.value,end:end.value,category});
 setTurns(turns);
 alert("Turno salvato");
}

function showArchive(){
 const turns=getTurns();
 out.textContent=turns.map(t=>`${t.date} ${t.start}-${t.end} (${t.category})`).join("\n");
}
date.valueAsDate=new Date();
</script>
</body>
</html>
